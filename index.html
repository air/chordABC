<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chordABC — Piano Chord to ABC Notation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>chordABC</h1>
<p class="subtitle">Build chords, then add them in ABC notation</p>

<div class="selected-display">
  <span class="label" id="selectedLabel">Click a key to build your chord</span>
  <span class="notes" id="selectedNotes"></span>
  <span class="chord-name" id="chordName"></span>
</div>

<div class="piano-wrapper">
  <div class="piano" id="piano"></div>
</div>

<div class="controls">
  <button class="primary" id="btnAddChord" disabled>Add this chord</button>
  <button id="btnUndo" disabled>Undo</button>
  <button id="btnClearKeys" disabled>Clear keys</button>
  <button class="danger" id="btnClear">Clear all</button>
</div>

<div class="output-section">
  <div class="output-left">
    <label for="abcOutput">ABC Notation Output</label>
    <div class="textarea-wrapper">
      <div id="abcHighlight"></div>
      <textarea id="abcOutput" readonly>X:1
T:Untitled
M:4/4
L:1/4
K:C
</textarea>
    </div>
    <div class="output-controls">
      <button id="btnLoad">Load .abc</button>
      <button id="btnDownload">Download .abc</button>
    </div>
    <input type="file" id="fileInput" accept=".abc,.txt" style="display:none">
  </div>
  <div class="output-right">
    <label>Rendered Staff</label>
    <div id="staffRender"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/abcjs@6/dist/abcjs-basic-min.js"></script>
<script src="app.js"></script>
</body>
</html>
